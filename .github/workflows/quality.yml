name: Project Quality Pipeline

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  quality-check:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Linting (Ruff)
      run: |
        chmod +x scripts/run_ruff.sh
        ./scripts/run_ruff.sh

    - name: Run Security Audit (pip-audit)
      run: |
        chmod +x scripts/audit_packages.sh
        ./scripts/audit_packages.sh

    - name: Run Tests (Pytest)
      env:
        DB_HOST: localhost
        DB_PORT: 5432
        DB_USER: postgres
        DB_PASS: postgres
        DB_NAME: postgres
        PYTHONPATH: .
      run: |
        chmod +x scripts/run_tests.sh
        ./scripts/run_tests.sh
