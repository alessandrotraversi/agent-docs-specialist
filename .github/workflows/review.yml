name: PR Review

# Workflow para revisão automática de código em Pull Requests
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

# Define as permissões necessárias para ler o conteúdo e escrever comentários no PR
permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Review Quality
    runs-on: ubuntu-latest

    steps:
      # Passo 1: Obtém o código fonte do repositório
      - name: Checkout
        uses: actions/checkout@v4

      # Passo 2: Instala e configura a versão correta do Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Passo 3: Instala as dependências para que o linter tenha contexto (opcional para alguns linters, mas recomendado)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Passo 4: Executa o Ruff integrado ao Reviewdog
      # O Reviewdog publica as mensagens de erro diretamente como comentários no Pull Request
      - name: Reviewdog (Ruff)
        uses: reviewdog/action-ruff@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          filter_mode: added
          fail_on_error: false
          ruff_args: "src/"

      # Passo 5: Executa o Semgrep para análise estática de segurança (SAST)
      - name: Semgrep (Security Scan)
        uses: returntocorp/semgrep-action@v1
        with:
          config: auto